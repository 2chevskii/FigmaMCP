name: CI Summary

on:
  workflow_call:

jobs:
  summary:
    name: Test results
    runs-on: ubuntu-24.04
    steps:
      - name: Download server test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: server-test-results
          path: artifacts/summary/server

      - name: Download plugin test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: plugin-test-results
          path: artifacts/summary/plugin

      - name: Set up .NET for coverage reporting
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Publish test results
        if: ${{ hashFiles('artifacts/summary/server/**/*.trx', 'artifacts/summary/plugin/tests/*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: |
            artifacts/summary/server/**/*.trx
            artifacts/summary/plugin/tests/*.xml
          check_run: false
          comment_mode: off
          compare_to_earlier_commit: false

      - name: Generate coverage report
        if: ${{ hashFiles('artifacts/summary/server/**/*.cobertura.xml', 'artifacts/summary/plugin/coverage/*.xml') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@049f7ec958c672fd31d5cc1cb01622dc8d2e23ab # 5.5.10
        with:
          reports: artifacts/summary/server/**/*.cobertura.xml;artifacts/summary/plugin/coverage/*.xml
          targetdir: artifacts/summary/coverage
          reporttypes: Html;MarkdownSummaryGithub
          title: figma-mcp coverage

      - name: Publish coverage summary
        if: ${{ hashFiles('artifacts/summary/coverage/SummaryGithub.md') != '' }}
        shell: pwsh
        run: Get-Content -Raw -LiteralPath ./artifacts/summary/coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ hashFiles('artifacts/summary/coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/summary/coverage
          if-no-files-found: error
          retention-days: 14
