name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  product_version:
    name: Calculate product version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Calculate product version
        id: version
        shell: pwsh
        run: |
          $versionFile = Join-Path $env:RUNNER_TEMP "product-version.txt"
          bash ./build.sh --target :version:calculate --version-output $versionFile
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $version = (Get-Content -Raw -LiteralPath $versionFile).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Cake did not produce a product version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

  commit_messages:
    name: Check commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check Conventional Commits
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $to = $env:HEAD_SHA
          $from = $env:BASE_SHA

          if ($env:EVENT_NAME -eq "push") {
            $from = $env:BEFORE_SHA
            if ([string]::IsNullOrWhiteSpace($from) -or $from -match "^0+$") {
              if ($env:REF_NAME -eq $env:DEFAULT_BRANCH) {
                $from = ""
              } else {
                $defaultBranchRef = "refs/remotes/origin/$($env:DEFAULT_BRANCH)"
                git show-ref --verify --quiet $defaultBranchRef
                if ($LASTEXITCODE -ne 0) {
                  git fetch --no-tags origin "+refs/heads/$($env:DEFAULT_BRANCH):$defaultBranchRef"
                  if ($LASTEXITCODE -ne 0) {
                    throw "Failed to fetch the default branch '$($env:DEFAULT_BRANCH)'."
                  }
                }

                $from = (git merge-base $to $defaultBranchRef)
                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($from)) {
                  throw "Failed to find a merge base between '$to' and '$defaultBranchRef'."
                }
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($from)) {
            bash ./build.sh --target :commits:check --to $to
          } else {
            bash ./build.sh --target :commits:check --from $from --to $to
          }

  server_format_check:
    name: Check MCP server formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: bash ./build.sh --target :server:format

  server_build:
    name: Build MCP server
    needs: product_version
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - linux-x64
          - osx-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build server
        run: bash ./build.sh --target :server:publish --configuration Release --runtime ${{ matrix.runtime }}

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-server-${{ matrix.runtime }}.${{ needs.product_version.outputs.version }}
          path: artifacts/server/${{ matrix.runtime }}
          if-no-files-found: error

  nuget_build:
    name: Build MCP server NuGet packages
    needs: product_version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build NuGet package and symbols
        run: bash ./build.sh --target :package:nuget --configuration Release

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: FigmaMCP.${{ needs.product_version.outputs.version }}
          path: |
            artifacts/release/FigmaMCP.${{ needs.product_version.outputs.version }}.nupkg
            artifacts/release/FigmaMCP.${{ needs.product_version.outputs.version }}.snupkg
          if-no-files-found: error

  server_test_build:
    name: Build MCP server unit tests
    needs: product_version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish server tests
        run: bash ./build.sh --target :server:publish-tests --configuration Release --runtime linux-x64

      - name: Upload server test executable
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-server-tests-linux-x64.${{ needs.product_version.outputs.version }}
          path: |
            artifacts/server-tests/linux-x64/FigmaMCP.Tests.Unit
            artifacts/server-tests/linux-x64/FigmaMCP.Tests.Unit.pdb
            artifacts/server-tests/linux-x64/FigmaMCP.pdb
          if-no-files-found: error

  server_test:
    name: Run MCP server unit tests
    needs:
      - product_version
      - server_test_build
    runs-on: ubuntu-24.04
    steps:
      - name: Download server test executable
        uses: actions/download-artifact@v8
        with:
          name: figma-mcp-server-tests-linux-x64.${{ needs.product_version.outputs.version }}
          path: artifacts/server-tests/linux-x64

      - name: Test server
        working-directory: artifacts/server-tests/linux-x64
        shell: pwsh
        run: |
          $resultsDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/server-test-results"
          $coverageSettings = Join-Path $env:RUNNER_TEMP "server-coverage.settings"
          $symbolDirectory = [System.Security.SecurityElement]::Escape((Get-Location).Path)
          $coverageConfiguration = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Configuration>
            <ExcludeAssembliesWithoutSources>None</ExcludeAssembliesWithoutSources>
            <CodeCoverage>
              <SymbolSearchPaths>
                <Path>$symbolDirectory</Path>
              </SymbolSearchPaths>
            </CodeCoverage>
          </Configuration>
          "@
          New-Item -ItemType Directory -Force -Path $resultsDirectory | Out-Null
          [System.IO.File]::WriteAllText($coverageSettings, $coverageConfiguration)
          chmod +x ./FigmaMCP.Tests.Unit
          & ./FigmaMCP.Tests.Unit `
            --results-directory $resultsDirectory `
            --report-trx `
            --report-trx-filename server.trx `
            --coverage `
            --coverage-settings $coverageSettings `
            --coverage-output-format cobertura `
            --coverage-output coverage.cobertura.xml
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }

          [xml] $coverage = Get-Content -Raw -LiteralPath (Join-Path $resultsDirectory "coverage.cobertura.xml")
          if ($null -eq $coverage.coverage.packages.package) {
            throw "The server coverage report does not contain any packages."
          }

      - name: Upload server test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: server-test-results.${{ needs.product_version.outputs.version }}
          path: artifacts/server-test-results
          if-no-files-found: warn
          retention-days: 14

  plugin_format_check:
    name: Check Figma plugin formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check plugin formatting
        run: bash ./build.sh --target :plugin:format

  plugin_lint:
    name: Lint Figma plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Lint plugin
        run: bash ./build.sh --target :plugin:lint

  plugin_test:
    name: Run Figma plugin unit tests
    needs: product_version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test plugin
        run: bash ./build.sh --target :plugin:test

      - name: Upload plugin test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-test-results.${{ needs.product_version.outputs.version }}
          path: |
            packages/plugin/TestResults/tests/junit.xml
            packages/plugin/TestResults/coverage/cobertura-coverage.xml
          if-no-files-found: warn
          retention-days: 14

  plugin_build:
    name: Build Figma plugin
    needs: product_version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build plugin
        run: bash ./build.sh --target :plugin:build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-plugin.${{ needs.product_version.outputs.version }}
          path: packages/plugin/dist
          if-no-files-found: error

  summary:
    name: Publish test reports
    if: ${{ always() && !cancelled() }}
    needs:
      - product_version
      - commit_messages
      - server_format_check
      - server_build
      - nuget_build
      - server_test_build
      - server_test
      - plugin_format_check
      - plugin_lint
      - plugin_test
      - plugin_build
    runs-on: ubuntu-24.04
    steps:
      - name: Download server test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: server-test-results.${{ needs.product_version.outputs.version }}
          path: artifacts/summary/server

      - name: Download plugin test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: plugin-test-results.${{ needs.product_version.outputs.version }}
          path: artifacts/summary/plugin

      - name: Set up .NET for coverage reporting
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Publish test results
        if: ${{ hashFiles('artifacts/summary/server/**/*.trx', 'artifacts/summary/plugin/tests/*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            artifacts/summary/server/**/*.trx
            artifacts/summary/plugin/tests/*.xml
          check_run: false
          comment_mode: off
          compare_to_earlier_commit: false

      - name: Generate coverage report
        if: ${{ hashFiles('artifacts/summary/server/**/*.cobertura.xml', 'artifacts/summary/plugin/coverage/*.xml') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: artifacts/summary/server/**/*.cobertura.xml;artifacts/summary/plugin/coverage/*.xml
          targetdir: artifacts/summary/coverage
          reporttypes: Html;MarkdownSummaryGithub
          title: figma-mcp coverage

      - name: Publish coverage summary
        if: ${{ hashFiles('artifacts/summary/coverage/SummaryGithub.md') != '' }}
        shell: pwsh
        run: Get-Content -Raw -LiteralPath ./artifacts/summary/coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ hashFiles('artifacts/summary/coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report.${{ needs.product_version.outputs.version }}
          path: artifacts/summary/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Require successful CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $unsuccessfulJobs = ($env:NEEDS_JSON | ConvertFrom-Json).PSObject.Properties |
            Where-Object { $_.Value.result -ne "success" }

          if ($unsuccessfulJobs.Count -gt 0) {
            $summary = $unsuccessfulJobs |
              ForEach-Object { "$($_.Name)=$($_.Value.result)" }
            throw "Required CI jobs did not succeed: $($summary -join ', ')."
          }
