name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  server_format_check:
    name: Server format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: bash ./build.sh --target :server:format

  server_build:
    name: Server build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            runtime: win-x64
            build_command: ./build.ps1
          - platform: Linux x64
            runner: ubuntu-24.04
            runtime: linux-x64
            build_command: bash ./build.sh
          - platform: macOS ARM64
            runner: macos-15
            runtime: osx-arm64
            build_command: bash ./build.sh
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build server
        run: ${{ matrix.build_command }} --target :server:publish --configuration Release --runtime ${{ matrix.runtime }}

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-server-${{ matrix.runtime }}
          path: artifacts/server/${{ matrix.runtime }}
          if-no-files-found: error

  server_test_build:
    name: Server test build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish server tests
        run: ./build.ps1 --target :server:publish-tests --configuration Release --runtime win-x64

      - name: Upload server test executable
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-server-tests-win-x64
          path: |
            artifacts/server-tests/win-x64/FigmaMCP.Tests.Unit.exe
            artifacts/server-tests/win-x64/FigmaMCP.Tests.Unit.pdb
            artifacts/server-tests/win-x64/FigmaMCP.pdb
          if-no-files-found: error

  server_test:
    name: Server test
    needs: server_test_build
    runs-on: windows-2025
    steps:
      - name: Download server test executable
        uses: actions/download-artifact@v8
        with:
          name: figma-mcp-server-tests-win-x64
          path: artifacts/server-tests/win-x64

      - name: Test server
        working-directory: artifacts/server-tests/win-x64
        run: |
          $resultsDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/server-test-results"
          New-Item -ItemType Directory -Force -Path $resultsDirectory | Out-Null
          & ./FigmaMCP.Tests.Unit.exe `
            --results-directory $resultsDirectory `
            --report-trx `
            --report-trx-filename server.trx `
            --coverage `
            --coverage-output-format cobertura `
            --coverage-output coverage.cobertura.xml
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }

          [xml] $coverage = Get-Content -Raw -LiteralPath (Join-Path $resultsDirectory "coverage.cobertura.xml")
          if ($null -eq $coverage.coverage.packages.package) {
            throw "The server coverage report does not contain any packages."
          }

      - name: Upload server test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: server-test-results
          path: artifacts/server-test-results
          if-no-files-found: warn
          retention-days: 14

  plugin_format_check:
    name: Plugin format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check plugin formatting
        run: bash ./build.sh --target :plugin:format

  plugin_lint:
    name: Plugin lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Lint plugin
        run: bash ./build.sh --target :plugin:lint

  plugin_test:
    name: Plugin test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test plugin
        run: bash ./build.sh --target :plugin:test

      - name: Upload plugin test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-test-results
          path: |
            packages/plugin/TestResults/tests/junit.xml
            packages/plugin/TestResults/coverage/cobertura-coverage.xml
          if-no-files-found: warn
          retention-days: 14

  plugin_build:
    name: Plugin build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build plugin
        run: bash ./build.sh --target :plugin:build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-plugin
          path: packages/plugin/dist
          if-no-files-found: error

  summary:
    name: Publish reports
    if: ${{ always() && !cancelled() }}
    needs:
      - server_format_check
      - server_build
      - server_test_build
      - server_test
      - plugin_format_check
      - plugin_lint
      - plugin_test
      - plugin_build
    runs-on: ubuntu-24.04
    steps:
      - name: Download server test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: server-test-results
          path: artifacts/summary/server

      - name: Download plugin test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: plugin-test-results
          path: artifacts/summary/plugin

      - name: Set up .NET for coverage reporting
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Publish test results
        if: ${{ hashFiles('artifacts/summary/server/**/*.trx', 'artifacts/summary/plugin/tests/*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            artifacts/summary/server/**/*.trx
            artifacts/summary/plugin/tests/*.xml
          check_run: false
          comment_mode: off
          compare_to_earlier_commit: false

      - name: Generate coverage report
        if: ${{ hashFiles('artifacts/summary/server/**/*.cobertura.xml', 'artifacts/summary/plugin/coverage/*.xml') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: artifacts/summary/server/**/*.cobertura.xml;artifacts/summary/plugin/coverage/*.xml
          targetdir: artifacts/summary/coverage
          reporttypes: Html;MarkdownSummaryGithub
          title: figma-mcp coverage

      - name: Publish coverage summary
        if: ${{ hashFiles('artifacts/summary/coverage/SummaryGithub.md') != '' }}
        shell: pwsh
        run: Get-Content -Raw -LiteralPath ./artifacts/summary/coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ hashFiles('artifacts/summary/coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/summary/coverage
          if-no-files-found: error
          retention-days: 14
