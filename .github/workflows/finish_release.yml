name: Finish release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag and package version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if ($tag -notmatch '^v(?<version>.+)$') {
            throw "Release tag '$tag' must start with v."
          }

          [xml]$project = Get-Content -Raw -Encoding UTF8 -LiteralPath 'packages/server/src/FigmaMCP/FigmaMCP.csproj'
          $version = $Matches.version
          if ($project.Project.PropertyGroup.Version -ne $version) {
            throw "Project version '$($project.Project.PropertyGroup.Version)' must match release tag version '$version'."
          }

          "package=FigmaMCP.$version.nupkg" >> $env:GITHUB_OUTPUT

  publish-nuget:
    name: Publish to NuGet.org
    needs: release-metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Download release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${{ github.event.release.tag_name }}"
          --repo "${{ github.repository }}"
          --pattern "${{ needs.release-metadata.outputs.package }}"
          --dir "$env:RUNNER_TEMP/release"

      - name: Publish package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Repository secret NUGET_API_KEY is required to publish to NuGet.org.'
          }

          dotnet nuget push "$env:RUNNER_TEMP/release/${{ needs.release-metadata.outputs.package }}" `
            --source 'https://api.nuget.org/v3/index.json' `
            --api-key $env:NUGET_API_KEY `
            --skip-duplicate

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: release-metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Download release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${{ github.event.release.tag_name }}"
          --repo "${{ github.repository }}"
          --pattern "${{ needs.release-metadata.outputs.package }}"
          --dir "$env:RUNNER_TEMP/release"

      - name: Publish package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet nuget push "$env:RUNNER_TEMP/release/${{ needs.release-metadata.outputs.package }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key $env:GITHUB_TOKEN
          --skip-duplicate
