name: Start release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate_source:
    name: Validate release source
    runs-on: ubuntu-24.04
    steps:
      - name: Require master
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          echo "Start release from the master branch, not $GITHUB_REF." >&2
          exit 1

  ci:
    name: CI
    needs: validate_source
    uses: ./.github/workflows/main.yml

  prepare_release:
    name: Build and create draft release
    needs:
      - validate_source
      - ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Configure release tag identity
        run: |
          git config --local user.name "2CHEVSKII"
          git config --local user.email "prsroman3@gmail.com"

      - name: Prepare draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash ./build.sh --target :release:prepare
          --configuration Release
