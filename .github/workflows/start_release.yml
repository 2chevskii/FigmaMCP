name: Start release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/main.yml

  prepare_release:
    name: Test, build, and create draft release
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Prepare draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash ./build.sh --target :release:prepare
          --configuration Release --release-tag "${{ github.ref_name }}"
