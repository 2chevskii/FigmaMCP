on:
  release:
    types: [published]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  publish:
    name: Build and publish release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: packages/server/global.json

      - name: Publish Windows companion
        run: >-
          dotnet publish packages/server/src/FigmaMCP/FigmaMCP.csproj
          --configuration Release
          -p:PublishProfile=win-x64
          --output "$env:RUNNER_TEMP/figma-mcp-server-win-x64"

      - name: Archive Windows companion
        run: >-
          Compress-Archive
          -Path "$env:RUNNER_TEMP/figma-mcp-server-win-x64/*"
          -DestinationPath "$env:RUNNER_TEMP/figma-mcp-server-win-x64.zip"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: packages/plugin
        run: npm ci

      - name: Build plugin
        working-directory: packages/plugin
        run: npm run build

      - name: Archive plugin
        run: >-
          Compress-Archive
          -Path "packages/plugin/dist/*"
          -DestinationPath "$env:RUNNER_TEMP/figma-mcp-plugin.zip"

      - name: Upload release assets
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "$env:RUNNER_TEMP/figma-mcp-server-win-x64.zip"
          "$env:RUNNER_TEMP/figma-mcp-plugin.zip"
          --clobber
        env:
          GH_TOKEN: ${{ github.token }}
