on: [push, pull_request]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  server-format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: packages/server/global.json

      - name: Check server formatting
        shell: pwsh
        working-directory: packages/server
        run: |
          dotnet tool restore
          dotnet csharpier check .

  plugin-format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install plugin dependencies
        run: npm ci --prefix packages/plugin

      - name: Check plugin formatting
        run: npm run format:check --prefix packages/plugin

  server-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/server
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: packages/server/global.json

      - name: Restore
        run: dotnet restore FigmaMcp.slnx

      - name: Build
        run: dotnet build FigmaMcp.slnx --configuration Release --no-restore

      - name: Upload server build artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-server-build
          path: |
            packages/server/**/bin
            packages/server/**/obj
          if-no-files-found: error

  server-test:
    needs: server-build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/server
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: packages/server/global.json

      - name: Download server build artifact
        uses: actions/download-artifact@v8
        with:
          name: figma-mcp-server-build
          path: packages/server

      - name: Restore test dependencies
        run: dotnet restore FigmaMcp.slnx

      - name: Test
        run: |
          $resultsDirectory = Join-Path $PWD "TestResults"
          New-Item -Path $resultsDirectory -ItemType Directory -Force | Out-Null
          dotnet test `
            --solution FigmaMcp.slnx `
            --configuration Release `
            --no-build `
            --no-restore `
            --results-directory $resultsDirectory `
            --report-trx `
            --report-trx-filename server.trx `
            --coverage `
            --coverage-output-format cobertura `
            --coverage-output (Join-Path $resultsDirectory "coverage.cobertura.xml")

      - name: Upload server test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: server-test-results
          path: packages/server/TestResults
          if-no-files-found: warn
          retention-days: 14

  server-publish:
    needs: server-build
    runs-on: windows-latest
    steps:
      - name: Download server build artifact
        uses: actions/download-artifact@v8
        with:
          name: figma-mcp-server-build
          path: packages/server

      - name: Publish server artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-server
          path: packages/server/src/FigmaMCP/bin/Release
          if-no-files-found: error

  plugin-lint:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  plugin-typecheck:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

  plugin-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          New-Item -Path TestResults/tests, TestResults/coverage -ItemType Directory -Force | Out-Null
          npm run test:coverage

      - name: Generate JUnit report
        if: ${{ !cancelled() }}
        run: npm run test:report

      - name: Upload plugin test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-test-results
          path: packages/plugin/TestResults
          if-no-files-found: warn
          retention-days: 14

  plugin-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-plugin
          path: packages/plugin/dist
          if-no-files-found: error

  summary:
    if: ${{ always() && !cancelled() }}
    needs:
      - server-test
      - plugin-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download server test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: server-test-results
          path: artifacts/summary/server

      - name: Download plugin test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: plugin-test-results
          path: artifacts/summary/plugin

      - name: Publish test and coverage summary
        shell: pwsh
        run: >-
          ./scripts/Write-CiSummary.ps1
          -ServerResultsPath ./artifacts/summary/server
          -PluginResultsPath ./artifacts/summary/plugin
