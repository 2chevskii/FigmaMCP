on: [push, pull_request]

permissions:
  contents: read

jobs:
  server:
    uses: ./.github/workflows/_server_ci.yml

  plugin:
    uses: ./.github/workflows/_plugin_ci.yml

  summary:
    name: Publish reports
    if: ${{ always() && !cancelled() }}
    needs:
      - server
      - plugin
    uses: ./.github/workflows/_summary.yml
