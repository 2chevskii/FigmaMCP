name: Validate

on: [push, pull_request]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  server:
    name: Server — test and build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/server
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: packages/server/global.json

      - name: Restore
        run: dotnet restore FigmaMcp.slnx

      - name: Build
        run: dotnet build FigmaMcp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution FigmaMcp.slnx --configuration Release --no-build

  plugin:
    name: Plugin — test and build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: figma-mcp-plugin
          path: packages/plugin/dist
          if-no-files-found: error
