name: Plugin CI

on:
  workflow_call:

jobs:
  plugin-format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install plugin dependencies
        run: npm ci --prefix packages/plugin

      - name: Check plugin formatting
        run: npm run format:check --prefix packages/plugin

  plugin-lint:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  plugin-typecheck:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

  plugin-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          New-Item -Path TestResults/tests, TestResults/coverage -ItemType Directory -Force | Out-Null
          npm run test:coverage

      - name: Upload plugin test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-test-results
          path: |
            packages/plugin/TestResults/tests/junit.xml
            packages/plugin/TestResults/coverage/cobertura-coverage.xml
          if-no-files-found: warn
          retention-days: 14

  plugin-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: figma-mcp-plugin
          path: packages/plugin/dist
          if-no-files-found: error
