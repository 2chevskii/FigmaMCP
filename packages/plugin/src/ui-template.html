<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--figma-color-bg, #ffffff);
        color: var(--figma-color-text, #1e1e1e);
      }

      body {
        font-size: 11px;
        line-height: 16px;
        letter-spacing: 0.005em;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--figma-color-border-selected, #0d99ff);
        outline-offset: 1px;
      }

      .plugin {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--figma-color-border, #e6e6e6);
      }

      .logo {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 6px;
        background: var(--figma-color-bg-brand, #0d99ff);
        color: var(--figma-color-text-onbrand, #ffffff);
      }

      .logo svg {
        width: 16px;
        height: 16px;
      }

      .title {
        min-width: 0;
      }

      .title h1 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        line-height: 16px;
      }

      .title p {
        margin: 0;
        color: var(--figma-color-text-secondary, #808080);
      }

      .content {
        display: grid;
        gap: 16px;
        padding: 16px;
      }

      .status {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 58px;
        padding: 12px;
        border: 1px solid var(--figma-color-border, #e6e6e6);
        border-radius: 6px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
      }

      .status-icon {
        position: relative;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--figma-color-bg-disabled, #e6e6e6);
        color: var(--figma-color-icon-secondary, #808080);
      }

      .status-icon::before {
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .status[data-state="connected"] .status-icon {
        background: var(--figma-color-bg-success-tertiary, #d8f2e3);
        color: var(--figma-color-icon-success, #14ae5c);
      }

      .status[data-state="connecting"] .status-icon,
      .status[data-state="reconnecting"] .status-icon,
      .status[data-state="loading_config"] .status-icon {
        animation: pulse 1.2s ease-in-out infinite;
        background: var(--figma-color-bg-brand-tertiary, #e5f4ff);
        color: var(--figma-color-icon-brand, #0d99ff);
      }

      .status[data-state="invalid_server_url"] .status-icon,
      .status[data-state="protocol_error"] .status-icon {
        background: var(--figma-color-bg-danger-tertiary, #ffe2e0);
        color: var(--figma-color-icon-danger, #f24822);
      }

      .status-copy {
        min-width: 0;
      }

      #state {
        font-weight: 600;
      }

      #details {
        overflow: hidden;
        margin-top: 1px;
        color: var(--figma-color-text-secondary, #808080);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .settings {
        display: grid;
        gap: 8px;
      }

      .section-label {
        color: var(--figma-color-text-secondary, #808080);
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 150px;
        gap: 12px;
        align-items: center;
      }

      .field-copy {
        min-width: 0;
      }

      .field-label {
        display: block;
        font-weight: 500;
      }

      .field-help {
        display: block;
        color: var(--figma-color-text-secondary, #808080);
      }

      input {
        width: 100%;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--figma-color-border-strong, #b3b3b3);
        border-radius: 5px;
        background: var(--figma-color-bg, #ffffff);
        color: var(--figma-color-text, #1e1e1e);
        text-align: left;
      }

      input:hover {
        border-color: var(--figma-color-border-selected, #0d99ff);
      }

      input[aria-invalid="true"] {
        border-color: var(--figma-color-border-danger, #f24822);
      }

      #error {
        min-height: 16px;
        color: var(--figma-color-text-danger, #d73220);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--figma-color-border, #e6e6e6);
      }

      button {
        min-width: 72px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
      }

      button:active {
        transform: translateY(1px);
      }

      .button-secondary {
        border-color: var(--figma-color-border, #e6e6e6);
        background: var(--figma-color-bg, #ffffff);
        color: var(--figma-color-text, #1e1e1e);
      }

      .button-secondary:hover {
        background: var(--figma-color-bg-hover, #f5f5f5);
      }

      .button-primary {
        background: var(--figma-color-bg-brand, #0d99ff);
        color: var(--figma-color-text-onbrand, #ffffff);
      }

      .button-primary:hover {
        background: var(--figma-color-bg-brand-hover, #007be5);
      }

      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-icon {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="plugin">
      <header class="header">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none">
            <path
              d="M5.25 4.25h5.5M5.25 8h5.5m-5.5 3.75h5.5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <circle cx="3" cy="4.25" r="1" fill="currentColor" />
            <circle cx="13" cy="8" r="1" fill="currentColor" />
            <circle cx="3" cy="11.75" r="1" fill="currentColor" />
          </svg>
        </div>
        <div class="title">
          <h1>MCP Connector</h1>
          <p>Connect this file to your local MCP server</p>
        </div>
      </header>

      <section class="content">
        <div
          id="status"
          class="status"
          data-state="loading_config"
          role="status"
          aria-live="polite"
        >
          <div class="status-icon" aria-hidden="true"></div>
          <div class="status-copy">
            <div id="state">Loading settings…</div>
            <div id="details">Preparing the connector</div>
          </div>
        </div>

        <div class="settings">
          <div class="section-label">Connection</div>
          <label class="field" for="server-url">
            <span class="field-copy">
              <span class="field-label">Local companion URL</span>
              <span class="field-help">HTTP loopback address only</span>
            </span>
            <input
              id="server-url"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="error"
              value="http://127.0.0.1:3846"
            />
          </label>
          <div id="error" role="alert" aria-live="assertive"></div>
        </div>
      </section>

      <footer class="actions">
        <button id="close" class="button-secondary" type="button">Close</button>
        <button id="save" class="button-primary" type="button">Reconnect</button>
      </footer>
    </main>
    <!-- UI_SCRIPT -->
  </body>
</html>
